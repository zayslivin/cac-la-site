<!--
  REUSABLE SECTION TEMPLATE — "Partner With Us" (Brands / Sponsors / Vendors)
  ---------------------------------------------------------------------------
  A partner-inquiry CTA block for event detail pages.

  Usage:
    1. Copy the <section> below into an event page near the bottom.
       Recommended placement: right after the "For Models" section and
       before the FAQ section (this mirrors the-creative-collective and
       studio-sets-social).
    2. Replace [EVENT NAME] with the event's display name
       (e.g. "Studio Sets Social").
    3. The "Inquire to partner" link uses ../../brands/inquire/ and assumes
       the page lives at events/<event-slug>/index.html (two levels deep).
       If the page sits at a different depth, adjust the relative path.

  Notes:
    - Uses only existing classes from styles.css (event-section, cream,
      container-narrow, eyebrow, section-title, body-serif, btn-pill ink).
    - Kept in a "_"-prefixed folder so GitHub Pages (Jekyll) does not
      publish it as a live page.
-->
<!-- =========== BRANDS / SPONSORS / VENDORS =========== -->
<section class="event-section cream">
  <div class="container-narrow" style="text-align:center;">
    <div class="eyebrow">Partner With Us</div>
    <h2 class="section-title fade-in" style="margin:18px 0 24px;">Brands, sponsors<br>&amp; vendors.</h2>
    <p class="body-serif fade-in" style="margin-bottom:32px;max-width:620px;margin-left:auto;margin-right:auto;">
      [EVENT NAME] is built to be sponsored, activated, and seen. If you're a brand,
      sponsor, or vendor who wants a presence at the event — a booth, an activation, product
      placement, or content — let's build it together.
    </p>
    <a href="../../brands/inquire/" class="btn-pill ink">Inquire to partner <span class="arrow">→</span></a>
  </div>
</section>
